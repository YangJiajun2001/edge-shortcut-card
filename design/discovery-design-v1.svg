<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .panel-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .panel-sub { font-size: 10.5px; fill: #64748b; }
      .card-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
      .search { font-size: 10px; fill: #94a3b8; }
      .btn { font-size: 9px; font-weight: 600; fill: #475569; }
      .kbd { font-size: 8.5px; font-weight: 600; fill: #334155; }
      .item { font-size: 10.5px; font-weight: 600; fill: #1e293b; }
      .item-small { font-size: 8.5px; fill: #94a3b8; }
      .count { font-size: 9px; font-weight: 700; fill: #0b7dda; }
      .hint { font-size: 8.5px; fill: #64748b; }
      .tiny { font-size: 7.5px; fill: #94a3b8; }
      .anno { font-size: 10.5px; fill: #475569; }
      .anno-blue { font-size: 10.5px; fill: #0b7dda; }
      .bottom { font-size: 12px; fill: #e2e8f0; }
      .welcome-title { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .welcome-sub { font-size: 9px; fill: #64748b; }
      .welcome-row { font-size: 9.5px; font-weight: 600; fill: #334155; }
    </style>
  </defs>

  <rect width="1680" height="1050" fill="#eef2f7"/>

  <text x="40" y="54" class="title">快捷键发现机制 · 设计草案 v1</text>
  <text x="40" y="82" class="subtitle">收起胶囊每日一条 + 首次安装 7 条：解决“不知道有这个快捷键”，不新增权限</text>

  <!-- ==================== 1. 收起态 ==================== -->
  <rect x="30" y="112" width="520" height="858" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="52" y="148" class="panel-title">① 收起态：每日一条</text>
  <text x="52" y="170" class="panel-sub">新安装默认收起；每天换一条，点击展开定位</text>

  <!-- fake page -->
  <rect x="60" y="200" width="460" height="620" rx="12" fill="#f8fafc" stroke="#dbe3ee"/>
  <rect x="60" y="200" width="460" height="34" rx="12" fill="#e2e8f0"/>
  <rect x="60" y="220" width="460" height="14" fill="#e2e8f0"/>
  <circle cx="80" cy="217" r="3" fill="#cbd5e1"/>
  <circle cx="91" cy="217" r="3" fill="#cbd5e1"/>
  <rect x="110" y="210" width="220" height="14" rx="7" fill="#f8fafc"/>
  <text x="82" y="265" font-size="11" font-weight="700" fill="#334155">页面内容</text>
  <rect x="82" y="282" width="360" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="82" y="298" width="300" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="82" y="314" width="330" height="8" rx="4" fill="#e2e8f0"/>
  <rect x="82" y="342" width="360" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="94" y="354" width="120" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="94" y="370" width="250" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="94" y="383" width="210" height="7" rx="3.5" fill="#e2e8f0"/>
  <rect x="82" y="414" width="360" height="56" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <rect x="94" y="426" width="160" height="8" rx="4" fill="#cbd5e1"/>
  <rect x="94" y="442" width="280" height="7" rx="3.5" fill="#e2e8f0"/>

  <!-- daily pill -->
  <rect x="338" y="430" width="182" height="58" rx="14" fill="#0b7dda" filter="url(#shadow)"/>
  <rect x="350" y="444" width="28" height="28" rx="7" fill="#ffffff" opacity="0.16"/>
  <text x="359" y="464" font-size="14" fill="#ffffff">⌨</text>
  <text x="388" y="452" font-size="9" font-weight="600" fill="#dbeafe">今日快捷键</text>
  <text x="388" y="468" font-size="11" font-weight="700" fill="#ffffff">Ctrl+Shift+T</text>
  <text x="388" y="481" font-size="8.5" fill="#dbeafe">重开标签</text>
  <text x="505" y="462" font-size="14" fill="#ffffff">›</text>

  <text x="52" y="850" class="anno">组合键 + 短标题；完整说明放悬停提示。</text>
  <text x="52" y="873" class="anno">点击：展开卡片并定位到该条，不增加搜索次数。</text>
  <text x="52" y="896" class="anno">当天固定；收起才显示；隐藏胶囊即停止提示。</text>
  <text x="52" y="919" class="anno">每日轮换，优先展示没看过的“低认知”快捷键。</text>

  <!-- ==================== 2. 点击后 ==================== -->
  <rect x="580" y="112" width="520" height="858" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="602" y="148" class="panel-title">② 点击后：卡片定位</text>
  <text x="602" y="170" class="panel-sub">空查询列表，选中并滚到该条；不计数</text>

  <rect x="660" y="200" width="360" height="620" rx="14" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
  <rect x="660" y="200" width="360" height="52" rx="14" fill="#f8fafc"/>
  <rect x="660" y="238" width="360" height="14" fill="#f8fafc"/>
  <rect x="674" y="214" width="28" height="22" rx="6" fill="#0b7dda"/>
  <text x="681" y="230" font-size="11" font-weight="700" fill="#ffffff">K</text>
  <text x="710" y="231" class="card-title">快捷键</text>
  <rect x="964" y="212" width="24" height="24" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="972" y="229" font-size="14" font-weight="700" fill="#64748b">−</text>
  <rect x="992" y="212" width="24" height="24" rx="7" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="999" y="229" font-size="14" font-weight="700" fill="#64748b">×</text>

  <rect x="670" y="260" width="236" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="682" y="280" class="search">搜索快捷键 / 功能…</text>
  <rect x="912" y="260" width="30" height="32" rx="8" fill="#e8f2fd" stroke="#d6e7fb"/>
  <text x="921" y="280" font-size="10" font-weight="700" fill="#0b7dda">⌨</text>
  <rect x="948" y="260" width="58" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="961" y="280" class="btn">频率 ⇅</text>

  <text x="670" y="310" class="tiny">最近</text>
  <rect x="698" y="298" width="88" height="20" rx="10" fill="#e8f2fd" stroke="#d6e7fb"/>
  <text x="706" y="312" class="kbd" fill="#0b7dda">Ctrl+Shift+T</text>
  <rect x="792" y="298" width="50" height="20" rx="10" fill="#e8f2fd" stroke="#d6e7fb"/>
  <text x="800" y="312" class="kbd" fill="#0b7dda">Ctrl+W</text>
  <rect x="848" y="298" width="50" height="20" rx="10" fill="#e8f2fd" stroke="#d6e7fb"/>
  <text x="856" y="312" class="kbd" fill="#0b7dda">Ctrl+F</text>

  <rect x="668" y="330" width="344" height="46" rx="8" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="676" y="350" class="kbd">Ctrl</text>
  <rect x="702" y="339" width="20" height="16" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="708" y="350" class="kbd">T</text>
  <text x="732" y="347" class="item">新建标签页</text>
  <text x="732" y="362" class="item-small">标签页</text>
  <text x="950" y="354" class="count">12</text>
  <line x1="670" y1="386" x2="1010" y2="386" stroke="#f1f5f9"/>

  <text x="676" y="410" class="kbd">Ctrl</text>
  <rect x="702" y="399" width="20" height="16" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="708" y="410" class="kbd">W</text>
  <text x="732" y="407" class="item">关闭当前标签页</text>
  <text x="732" y="422" class="item-small">标签页 · 备选 Ctrl F4</text>
  <text x="950" y="414" class="count">8</text>
  <line x1="670" y1="446" x2="1010" y2="446" stroke="#f1f5f9"/>

  <rect x="666" y="454" width="348" height="52" rx="8" fill="#e8f2fd" stroke="#0b7dda"/>
  <text x="676" y="480" class="kbd">Ctrl</text>
  <rect x="702" y="469" width="30" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="707" y="480" class="kbd">Shift</text>
  <rect x="736" y="469" width="20" height="16" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="742" y="480" class="kbd">T</text>
  <text x="766" y="477" class="item">重新打开关闭的标签页</text>
  <text x="766" y="492" class="item-small">标签页 · 今日提示</text>
  <text x="950" y="484" class="count">5</text>

  <text x="676" y="530" class="kbd">Ctrl</text>
  <rect x="702" y="519" width="20" height="16" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="708" y="530" class="kbd">F</text>
  <text x="732" y="527" class="item">页内查找</text>
  <text x="732" y="542" class="item-small">页面与查找 · 备选 F3</text>
  <text x="950" y="534" class="count">3</text>
  <line x1="670" y1="566" x2="1010" y2="566" stroke="#f1f5f9"/>

  <text x="676" y="590" class="kbd">Ctrl</text>
  <rect x="702" y="579" width="20" height="16" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="708" y="590" class="kbd">L</text>
  <text x="732" y="587" class="item">聚焦地址栏</text>
  <text x="732" y="602" class="item-small">地址栏 · 备选 Alt D / F4</text>
  <text x="950" y="594" class="count">2</text>

  <line x1="660" y1="792" x2="1020" y2="792" stroke="#e2e8f0"/>
  <text x="672" y="812" class="hint">↑↓ 选择 · Enter 记录选中项</text>
  <text x="672" y="826" class="tiny">F2 按键录入 · 空查询不计数</text>
  <rect x="900" y="800" width="48" height="24" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="911" y="816" class="btn">刷新</text>
  <rect x="954" y="800" width="48" height="24" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="965" y="816" class="btn">恢复</text>

  <text x="602" y="850" class="anno">点击胶囊后，卡片直接滚到该条并高亮。</text>
  <text x="602" y="873" class="anno">不写入搜索次数，不加入最近 3 条。</text>
  <text x="602" y="896" class="anno">用户仍可 ↑↓ 浏览、Enter 记录、F2 录入。</text>
  <text x="602" y="919" class="anno">卡片布局不变，不新增“今日”分组。</text>

  <!-- ==================== 3. 首次安装 ==================== -->
  <rect x="1130" y="112" width="520" height="858" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="1152" y="148" class="panel-title">③ 首次安装：7 条“你可能不知道”</text>
  <text x="1152" y="170" class="panel-sub">只在 install 打开一次；update 不打扰</text>

  <rect x="1160" y="190" width="460" height="650" rx="12" fill="#ffffff" stroke="#dbe3ee" filter="url(#shadow)"/>
  <rect x="1160" y="190" width="460" height="58" rx="12" fill="#0b7dda"/>
  <rect x="1160" y="236" width="460" height="12" fill="#0b7dda"/>
  <text x="1182" y="219" font-size="15" font-weight="700" fill="#ffffff">你可能不知道的 7 个 Edge 快捷键</text>
  <text x="1182" y="236" font-size="8.5" fill="#dbeafe">先认识它们，再决定要不要用。</text>

  <text x="1182" y="270" class="welcome-sub">每天在页面右侧胶囊里，也会看到一条。</text>

  <!-- 7 rows -->
  <rect x="1180" y="286" width="420" height="38" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1192" y="309" class="kbd" fill="#0b7dda">Ctrl+Shift+T</text>
  <text x="1284" y="309" class="welcome-row">重新打开关闭的标签页</text>
  <text x="1540" y="309" class="tiny">标签页</text>

  <rect x="1180" y="330" width="420" height="38" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1192" y="353" class="kbd" fill="#0b7dda">Ctrl+Shift+N</text>
  <text x="1284" y="353" class="welcome-row">新建 InPrivate 窗口</text>
  <text x="1540" y="353" class="tiny">窗口</text>

  <rect x="1180" y="374" width="420" height="38" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1192" y="397" class="kbd" fill="#0b7dda">Ctrl+Shift+V</text>
  <text x="1284" y="397" class="welcome-row">粘贴为纯文本</text>
  <text x="1540" y="397" class="tiny">编辑</text>

  <rect x="1180" y="418" width="420" height="38" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1192" y="441" class="kbd" fill="#0b7dda">Ctrl+Shift+S</text>
  <text x="1284" y="441" class="welcome-row">网页捕获</text>
  <text x="1540" y="441" class="tiny">Edge 特色</text>

  <rect x="1180" y="462" width="420" height="38" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1192" y="485" class="kbd" fill="#0b7dda">Ctrl+Shift+Y</text>
  <text x="1284" y="485" class="welcome-row">打开集锦</text>
  <text x="1540" y="485" class="tiny">Edge 特色</text>

  <rect x="1180" y="506" width="420" height="38" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1192" y="529" class="kbd" fill="#0b7dda">Ctrl+Tab</text>
  <text x="1284" y="529" class="welcome-row">下一个标签页</text>
  <text x="1540" y="529" class="tiny">标签页</text>

  <rect x="1180" y="550" width="420" height="38" rx="7" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="1192" y="573" class="kbd" fill="#0b7dda">Ctrl+1~8</text>
  <text x="1284" y="573" class="welcome-row">跳到第 N 个标签页</text>
  <text x="1540" y="573" class="tiny">标签页</text>

  <rect x="1180" y="608" width="160" height="34" rx="8" fill="#0b7dda"/>
  <text x="1200" y="629" font-size="10" font-weight="700" fill="#ffffff">开始使用</text>
  <text x="1352" y="629" class="tiny">可在 edge://extensions 固定到工具栏</text>

  <rect x="1180" y="662" width="420" height="46" rx="8" fill="#f0f7ff" stroke="#d6e7fb"/>
  <text x="1192" y="680" font-size="9" font-weight="700" fill="#0b7dda">之后怎么看？</text>
  <text x="1192" y="696" font-size="8.5" fill="#475569">关掉这个页面后，右侧胶囊每天会显示一条；点击展开。</text>

  <text x="1152" y="870" class="anno">7 条高价值、低认知快捷键；不是教程。</text>
  <text x="1152" y="893" class="anno">首次安装打开；update 不打开。</text>
  <text x="1152" y="916" class="anno">现有用户不强制改变形态；可手动收起体验。</text>

  <rect x="30" y="990" width="1620" height="40" rx="12" fill="#0f172a"/>
  <text x="50" y="1015" class="bottom">方案：每日一条胶囊 + 首次 7 条；不做每日 toast / 通知 / 新权限；点击提示只定位，不计数。</text>
</svg>
