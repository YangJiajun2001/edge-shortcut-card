  <rect x="118" y="458" width="344" height="50" rx="8" fill="#e8f2fd" stroke="#0b7dda"/>
  <text x="126" y="478" class="kbd">Ctrl</text>
  <rect x="152" y="467" width="30" height="15" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="157" y="478" class="kbd">Shift</text>
  <rect x="186" y="467" width="18" height="15" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="191" y="478" class="kbd">T</text>
  <text x="214" y="475" class="item">重新打开关闭的标签页</text>
  <text x="214" y="489" class="item-small">标签页 · 推荐</text>
  <text x="430" y="478" font-size="13" font-weight="700" fill="#0b7dda">↗</text>
  <text x="450" y="478" class="count">5</text>
  <line x1="120" y1="516" x2="460" y2="516" stroke="#f1f5f9"/>

  <!-- row 4 -->
  <text x="126" y="544" class="kbd">Ctrl</text>
  <rect x="152" y="533" width="18" height="15" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="157" y="544" class="kbd">F</text>
  <text x="180" y="541" class="item">页内查找</text>
  <text x="180" y="555" class="item-small">页面与查找 · 备选 F3</text>
  <text x="448" y="544" class="count">3</text>
  <line x1="120" y1="572" x2="460" y2="572" stroke="#f1f5f9"/>

  <!-- row 5 -->
  <text x="126" y="600" class="kbd">Ctrl</text>
  <rect x="152" y="589" width="18" height="15" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
