  <text x="180" y="667" class="item-small">页面与查找</text>
  <line x1="120" y1="684" x2="460" y2="684" stroke="#f1f5f9"/>

  <!-- row 7 -->
  <text x="126" y="712" class="kbd">Ctrl</text>
  <rect x="152" y="701" width="30" height="15" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="157" y="712" class="kbd">Shift</text>
  <rect x="186" y="701" width="18" height="15" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
