  <text x="752" y="456" class="tiny">快捷键</text>
  <rect x="752" y="464" width="32" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="760" y="483" class="kbd">Ctrl</text>
  <rect x="790" y="464" width="26" height="30" rx="5" fill="#f8fafc" stroke="#e2e8f0"/>
