  <line x1="110" y1="786" x2="470" y2="786" stroke="#e6e8eb"/>
  <text x="122" y="806" class="hint">↑↓ 选择 · Enter 记录</text>
  <text x="122" y="821" class="tiny">F2 录入 · Alt+O 官方</text>
  <rect x="362" y="796" width="44" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="373" y="811" class="btn">刷新</text>
  <rect x="412" y="796" width="44" height="22" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="423" y="811" class="btn">恢复</text>

  <text x="52" y="872" class="anno">F2 从图标改为键帽，和胶囊里的 F8 使用同一套语言。</text>
  <text x="52" y="895" class="anno">官方入口改为选中时出现的 ↗；Alt+O 仍然可用。</text>
  <text x="52" y="918" class="anno">行高保持紧凑，360px 宽度不增加。</text>
  <text x="52" y="941" class="anno">页脚左提示、右操作，恢复按钮弱化为次要操作。</text>

  <!-- ==================== 2. PILL / COMPONENTS ==================== -->
  <rect x="580" y="112" width="520" height="858" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="602" y="148" class="panel-title">② 胶囊与组件</text>
  <text x="602" y="170" class="panel-sub">收起态、键帽、官方 ↗、焦点态</text>

  <rect x="640" y="230" width="400" height="120" rx="14" fill="#f8fafc" stroke="#e6e8eb"/>
  <text x="660" y="258" class="tiny">收起态（浅色）</text>

