<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1050" viewBox="0 0 1680 1050">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .panel-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .panel-sub { font-size: 10.5px; fill: #64748b; }
      .card-title { font-size: 12.5px; font-weight: 700; fill: #1f2328; }
      .search { font-size: 10px; fill: #94a3b8; }
      .btn { font-size: 9px; font-weight: 600; fill: #475569; }
      .kbd { font-size: 9px; font-weight: 600; fill: #334155; font-family: ui-monospace, Consolas, monospace; }
      .item { font-size: 10.5px; font-weight: 600; fill: #1e293b; }
      .item-small { font-size: 8.5px; fill: #94a3b8; }
      .count { font-size: 9px; font-weight: 700; fill: #0b7dda; }
      .hint { font-size: 8.5px; fill: #64748b; }
      .tiny { font-size: 7.5px; fill: #94a3b8; }
      .anno { font-size: 10.5px; fill: #475569; }
      .anno-blue { font-size: 10.5px; fill: #0b7dda; }
      .bottom { font-size: 12px; fill: #e2e8f0; }
      .dark-title { font-size: 12.5px; font-weight: 700; fill: #f1f3f5; }
      .dark-search { font-size: 10px; fill: #9aa0a6; }
      .dark-item { font-size: 10.5px; font-weight: 600; fill: #f1f3f5; }
      .dark-small { font-size: 8.5px; fill: #9aa0a6; }
      .dark-kbd { font-size: 9px; font-weight: 600; fill: #e5e7eb; font-family: ui-monospace, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1680" height="1050" fill="#eef2f7"/>
  <text x="40" y="54" class="title">UI 方向 A · 平静工具风</text>
  <text x="40" y="82" class="subtitle">360px · F2/F8 统一键帽 · 官方入口改为 ↗ · 保持现有信息结构</text>

  <!-- ==================== 1. LIGHT CARD ==================== -->
  <rect x="30" y="112" width="520" height="858" rx="20" fill="#ffffff" stroke="#dbe3ee"/>
  <text x="52" y="148" class="panel-title">① 展开态 · 浅色</text>
  <text x="52" y="170" class="panel-sub">只收敛视觉，不改变卡片结构</text>

  <rect x="110" y="190" width="360" height="650" rx="14" fill="#ffffff" stroke="#e6e8eb" filter="url(#shadow)"/>

  <!-- header -->
  <rect x="110" y="190" width="360" height="46" rx="14" fill="#f8fafc"/>
  <rect x="110" y="222" width="360" height="14" fill="#f8fafc"/>
  <rect x="122" y="202" width="24" height="22" rx="6" fill="#0b7dda"/>
  <text x="129" y="217" font-size="10" font-weight="700" fill="#ffffff">K</text>
  <text x="154" y="218" class="card-title">快捷键</text>
  <rect x="418" y="202" width="22" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="425" y="217" font-size="12" font-weight="700" fill="#64748b">−</text>
  <rect x="444" y="202" width="22" height="22" rx="6" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="451" y="217" font-size="12" font-weight="700" fill="#64748b">×</text>

  <!-- search -->
  <rect x="120" y="246" width="236" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="132" y="266" class="search">搜索快捷键 / 功能…</text>
  <rect x="362" y="246" width="30" height="32" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="371" y="265" class="kbd" fill="#0b7dda">F2</text>
  <rect x="398" y="246" width="58" height="32" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="409" y="265" class="btn">频率 ⇅</text>

  <!-- recent -->
  <text x="120" y="292" class="tiny">最近</text>
  <rect x="148" y="280" width="88" height="20" rx="10" fill="#e8f2fd" stroke="#d6e7fb"/>
  <text x="156" y="294" class="kbd" fill="#0b7dda">Ctrl+Shift+T</text>
  <rect x="242" y="280" width="50" height="20" rx="10" fill="#e8f2fd" stroke="#d6e7fb"/>
  <text x="250" y="294" class="kbd" fill="#0b7dda">Ctrl+W</text>
  <rect x="298" y="280" width="50" height="20" rx="10" fill="#e8f2fd" stroke="#d6e7fb"/>
  <text x="306" y="294" class="kbd" fill="#0b7dda">Ctrl+F</text>

  <!-- context -->
  <rect x="120" y="312" width="340" height="28" rx="7" fill="#f0f7ff" stroke="#d6e7fb"/>
  <text x="130" y="330" font-size="8" font-weight="700" fill="#0b7dda">输入框</text>
  <text x="164" y="330" font-size="8" fill="#475569">Ctrl+C 复制 · Ctrl+V 粘贴 · Ctrl+Z 撤销 · Ctrl+A 全选</text>

  <!-- list -->
  <!-- row 1 -->
  <text x="126" y="366" class="kbd">Ctrl</text>
  <rect x="152" y="355" width="18" height="15" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="157" y="366" class="kbd">T</text>
  <text x="180" y="363" class="item">新建标签页</text>
  <text x="180" y="377" class="item-small">标签页</text>
  <text x="448" y="366" class="count">12</text>
  <line x1="120" y1="394" x2="460" y2="394" stroke="#f1f5f9"/>

  <!-- row 2 -->
  <text x="126" y="422" class="kbd">Ctrl</text>
  <rect x="152" y="411" width="18" height="15" rx="4" fill="#f1f5f9" stroke="#e2e8f0"/>
  <text x="157" y="422" class="kbd">W</text>
  <text x="180" y="419" class="item">关闭当前标签页</text>
