  <text x="852" y="456" class="tiny">官方</text>
  <text x="856" y="483" font-size="18" font-weight="700" fill="#0b7dda">↗</text>

  <!-- selected row detail -->
  <text x="602" y="538" class="panel-title" font-size="14">选中行</text>
  <rect x="620" y="558" width="440" height="58" rx="8" fill="#e8f2fd" stroke="#0b7dda"/>
  <text x="634" y="582" class="kbd">Ctrl</text>
  <rect x="660" y="571" width="30" height="15" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="665" y="582" class="kbd">Shift</text>
  <rect x="694" y="571" width="18" height="15" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="699" y="582" class="kbd">T</text>
  <text x="722" y="579" class="item">重新打开关闭的标签页</text>
  <text x="722" y="593" class="item-small">标签页 · 推荐</text>
  <text x="1006" y="582" font-size="13" font-weight="700" fill="#0b7dda">↗</text>
  <text x="1030" y="582" class="count">5</text>

  <text x="602" y="650" class="anno">↗ 只在选中/悬停时出现；不挤压标题，不常驻。</text>
  <text x="602" y="673" class="anno">F2 与 F8 都是键帽，视觉上属于同一套快捷键语言。</text>
  <text x="602" y="696" class="anno">胶囊仍保持两行：组合键 + 短标题。</text>

  <!-- tokens -->
  <rect x="620" y="736" width="440" height="142" rx="10" fill="#f8fafc" stroke="#e6e8eb"/>
  <text x="636" y="760" font-size="10" font-weight="700" fill="#475569">基础参数</text>
  <text x="636" y="782" class="tiny">卡片 360px · 圆角 14 · 行圆角 8 · 键帽圆角 5</text>
  <text x="636" y="800" class="tiny">主色 #0B7DDA · 选中底 #E8F2FD · 边框 #E6E8EB</text>
  <text x="636" y="818" class="tiny">正文 10.5px · 辅助 8.5px · 键帽等宽 9px</text>
  <text x="636" y="836" class="tiny">动效 120–160ms · 焦点环 1px 主色 · 不使用弹跳</text>

  <text x="602" y="918" class="anno">维持现有密度，不新增面板或分组。</text>
  <text x="602" y="941" class="anno">设计目标：安静、顺手、每天看不累。</text>

