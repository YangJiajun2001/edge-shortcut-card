  <text x="676" y="303" font-size="13" font-weight="700" fill="#ffffff">K</text>
  <text x="696" y="295" font-size="10.5" font-weight="700" fill="#ffffff" font-family="ui-monospace, Consolas, monospace">Ctrl+Shift+T</text>
  <text x="696" y="310" font-size="8.5" fill="#dbeafe">重开标签</text>
  <rect x="802" y="289" width="26" height="18" rx="4" fill="#ffffff" opacity="0.16" stroke="#ffffff" stroke-opacity="0.55"/>
  <text x="807" y="302" font-size="8" font-weight="700" fill="#ffffff" font-family="ui-monospace, Consolas, monospace">F8</text>

  <text x="660" y="350" class="tiny">F8 小键帽固定在右侧，不占第三行；点击胶囊仍然展开。</text>
  <text x="660" y="368" class="tiny">悬停标题：F8 记下已试 · 点击查看。</text>

  <!-- components -->
  <text x="602" y="424" class="panel-title" font-size="14">键帽与状态</text>

  <text x="620" y="456" class="tiny">F2</text>
  <rect x="620" y="464" width="34" height="30" rx="5" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="632" y="483" class="kbd" fill="#0b7dda">F2</text>

  <text x="686" y="456" class="tiny">F8</text>
  <rect x="686" y="464" width="34" height="30" rx="5" fill="#0b7dda"/>
