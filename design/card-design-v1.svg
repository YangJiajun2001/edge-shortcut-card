      .btn { font-size: 10px; font-weight: 600; fill: #334155; }
      .count { font-size: 10px; font-weight: 700; fill: #0b7dda; }
      .pro { font-size: 11px; fill: #475569; }
      .rule { font-size: 12px; fill: #334155; }
      .ruleLight { font-size: 12px; fill: #e2e8f0; }
      .white { fill: #ffffff; }
    </style>
