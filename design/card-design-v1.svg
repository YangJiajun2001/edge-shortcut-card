  <text x="64" y="942" class="pro">✓ 展开 / 收起 / 位置状态可跨标签页同步保存</text>
  <text x="64" y="964" class="pro">△ 换页或刷新会重建卡片；edge:// 页面无法注入悬浮层</text>

