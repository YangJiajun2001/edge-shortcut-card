    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      text { font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif; }
      .title { font-size: 28px; font-weight: 700; fill: #111827; }
      .subtitle { font-size: 14px; fill: #64748b; }
      .panel-title { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .panel-sub { font-size: 11px; fill: #64748b; }
