  <text x="60" y="1009" class="ruleLight">交互规则：搜索框 Enter → 当前首条结果搜索次数 +1；点击条目不计数；刷新 / 恢复；收起 / 展开状态全局保存。请选 A 或 B，确认后我再改代码。</text>
